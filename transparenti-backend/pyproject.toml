[project]
name = "transparenti-backend"
version = "1.0.0"
description = "API FastAPI da central de chamados TransparenTI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "email-validator>=2.0,<3.0",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.0,<3.0",
  "PyJWT>=2.8,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
